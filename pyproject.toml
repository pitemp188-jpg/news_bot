[project]
name = "newsbot"
version = "0.0.1"
description = "AI 驱动的资讯机器人：定时推送与聊天指令两条入口，由 Agent 驱动搜索与浏览器采集信息并推送到微信 / QQ"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "APScheduler>=3.10",
    "httpx>=0.27",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbot"]

[tool.uv]
# 项目在 D 盘、uv 缓存在 C 盘，跨盘无法硬链接，直接复制避免每次回退告警
link-mode = "copy"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# docs 是中文文档，其中的 Python 片段是契约示意，不参与格式化
extend-exclude = ["docs", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501", # 中文注释与消息文本常超长，行长由 ruff format 负责
    "RUF001", "RUF002", "RUF003", # 全角标点是中文内容的正常写法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# APScheduler 未提供类型存根
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = '-q --strict-markers -m "not live and not soak"'
markers = [
    "integration: 需要真实 SQLite / 本地网页 / 多模块协作",
    "e2e: 全链路，含真实浏览器",
    "live: 需要真实外部服务与密钥，手动或每日定时运行",
    "soak: 长时间浸泡测试，发版前手动运行",
]

[tool.coverage.run]
source = ["src/newsbot"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
