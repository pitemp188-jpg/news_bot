name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 19 * * *" # 每日 03:00（Asia/Shanghai）跑一次 live 测试

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      - name: 全量检查
        run: uv run python scripts/check.py

      - name: live 测试
        if: github.event_name == 'schedule'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "未配置模型密钥，跳过 live 测试"
            exit 0
          fi
          uv run python scripts/check.py --live
