# 复制为 config.yaml 后按需修改。非敏感配置放这里，密钥放 .env
app:
  timezone: Asia/Shanghai
  log_level: INFO

queue:
  concurrency: 2 # 同时执行的任务数
  task_timeout_seconds: 600
  max_attempts: 2
  retry_delay_seconds: 5

schedule:
  default_time: "21:00" # 未指定时间的订阅默认推送时间
  default_topics:
    - AI
  dedup_days: 7 # 与近 N 天已推送内容去重
  dedup_with_llm: true # 让模型判断"这几条是不是同一件事"（只做分组，保留哪条由规则定）
  dedup_llm_timeout_seconds: 90 # 语义分组的超时

agent:
  max_steps: 50 # 规划循环最大步数
  max_tokens: 1000000 # 单任务累计 token 预算（每步累加 prompt+completion）
  fetch_max_bytes: 2000000
  search_results: 8
  browser_concurrency: 1 # 浏览器动作并发
  browser_timeout_seconds: 120 # 单个浏览器动作的时限（浏览器侧不调用模型）
  browser_headless: true # 本地调试想看窗口时改 false

delivery:
  chunk_delay_seconds: 1.5 # 分段发送间隔
  max_attempts: 3
  fallback_platform: qqbot # 主通道失败时的备用通道

editorial:
  # 精选：同一份标准对每条候选用模型独立打两次分，两次之和达到 2 倍门槛才入选。
  # 门槛按信源分级定（T1 一手发布 / T1_5 官方账号与准官方 / T2 媒体与个人）。
  tier_thresholds:
    T1: 6
    T1_5: 7
    T2: 8
  # 官方一手域名（进 T1）与准官方域名（进 T1_5）。留空表示全部按 T2 处理。
  # 只写你确实能核实的域名——把陌生来源当官方等于替读者背书
  official_domains: []
  quasi_official_domains: []
  score_timeout_seconds: 60 # 单次打分的时限（推理模型，实测数秒到数十秒）
  score_max_tokens: 4000 # 推理 token 与正文共用额度，给太小会"调用成功但正文为空"
  unstable_gap: 3 # 两次分差达到这个值就标为需人工复核（差值本身是信号，不取平均掩盖）
  max_candidates: 40 # 一次最多打分多少条（逐条两次 = 双倍成本，必须设上限）

api:
  host: 127.0.0.1
  port: 8765

search:
  # 仅当 SEARCH_PROVIDER=feeds 时生效：订阅权威源的 RSS，按关键词过滤。
  # 只收录实测可直连、且给出真实文章地址的源。可以只写网址（等价于 weight=1.0），
  # 也可以写成 {url, weight, topics} 给源打质量权重——权重既影响检索排序，
  # 也是"同一件事的多家报道保留哪一条"的依据。
  feeds:
    - url: https://www.qbitai.com/feed
      weight: 1.2
      topics: [AI]
    - url: https://www.infoq.cn/feed
      weight: 1.1
      topics: [开发]
    - url: https://venturebeat.com/feed/
      weight: 1.0
      topics: [AI]
    - https://www.ifanr.com/feed
    - https://www.solidot.org/index.rss
    - https://techcrunch.com/feed/
    - https://semiengineering.com/feed/
    - https://www.eetimes.com/feed/
  feed_concurrency: 4 # 同时拉取的源数量（实测 6 会让多个源同时失败）
